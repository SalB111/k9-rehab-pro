# K9 Rehab Pro — Render Blueprint (Single Service)
# Backend serves frontend from public/ — one deployment, everything works.
# Deploy: Render Dashboard → New → Blueprint → Connect this repo

services:
  - type: web
    name: k9-rehab-pro
    runtime: node
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    disk:
      name: k9-data
      mountPath: /var/data/k9-rehab-pro
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Comma-separated. Setting this OVERRIDES the allowlist in server.js
      # entirely, so every origin that must reach the API belongs here —
      # including B.E.A.U. at Home, which deploys separately to Vercel and
      # whose clients would otherwise be blocked by CORS the moment they open
      # their exercise programme.
      - key: CORS_ORIGIN
        value: "https://k9-rehab-pro.onrender.com,https://beauaihome.vercel.app,https://beauaihome-salb111s-projects.vercel.app"
      - key: DB_PATH
        value: /var/data/k9-rehab-pro/database.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
